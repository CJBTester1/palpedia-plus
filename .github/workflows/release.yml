name: Build portable Palpedia+

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build minified single-file edition
        run: |
          npx --yes html-minifier-terser index.html \
            --collapse-whitespace \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --minify-css true \
            --minify-js true \
            -o palpedia-plus.html
      - name: Validate portable build
        run: |
          test -s palpedia-plus.html
          grep -q "Palpedia+" palpedia-plus.html
          grep -q "Interactive Palworld map" palpedia-plus.html
          grep -q "Pal Build Calculator" palpedia-plus.html
      - uses: actions/upload-artifact@v4
        with:
          name: palpedia-plus-portable
          path: palpedia-plus.html
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" palpedia-plus.html --repo "${GITHUB_REPOSITORY}" --generate-notes --title "Palpedia+ ${GITHUB_REF_NAME}"
